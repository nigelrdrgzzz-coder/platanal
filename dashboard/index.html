<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Platanal</title>
  <link rel="stylesheet" href="../assets/css/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    .grid-2 { display:grid; grid-template-columns:2fr 1fr; gap:16px; }
    .alerta-item { display:flex; align-items:flex-start; gap:12px; padding:14px 0; border-bottom:1px solid var(--gris2); }
    .alerta-item:last-child { border-bottom:none; }
    .alerta-ico { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .alerta-ico.warn { background:#FEF3C7; }
    .alerta-ico.rojo { background:#FEE2E2; }
    .alerta-ico.ok { background:#D1FAE5; }
    .alerta-txt strong { font-size:13px; display:block; margin-bottom:2px; }
    .alerta-txt span { font-size:12px; color:var(--subtexto); }
    .finca-row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--gris2); }
    .finca-row:last-child { border-bottom:none; }
    .finca-av { width:34px; height:34px; border-radius:8px; background:var(--verde); color:var(--amarillo); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
    .finca-info { flex:1; }
    .finca-info strong { font-size:13px; display:block; }
    .finca-info span { font-size:11px; color:var(--subtexto); }
    .finca-kg { text-align:right; }
    .finca-kg strong { font-size:13px; display:block; }
    .finca-kg span { font-size:11px; color:var(--subtexto); }
    @media(max-width:900px) { .grid-2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h2>Dashboard</h2>
        <div class="topbar-sub" id="fecha"></div>
      </div>
      <div class="topbar-right">
        <a href="../recepcion/nuevo.html" class="btn btn-primary">+ Nueva recepción</a>
      </div>
    </div>

    <div class="content">
      <div id="alert"></div>

      <div class="kpi-grid">
        <div class="kpi verde">
          <div class="kpi-icon">📥</div>
          <div class="kpi-val" id="k_hoy">—</div>
          <div class="kpi-lbl">Albaranes hoy</div>
        </div>
        <div class="kpi amarillo">
          <div class="kpi-icon">⚖️</div>
          <div class="kpi-val" id="k_kg">—</div>
          <div class="kpi-lbl">Kg recibidos hoy</div>
        </div>
        <div class="kpi azul">
          <div class="kpi-icon">📦</div>
          <div class="kpi-val" id="k_stock">—</div>
          <div class="kpi-lbl">Kg en cámara</div>
        </div>
        <div class="kpi amarillo">
          <div class="kpi-icon">✅</div>
          <div class="kpi-val" id="k_calidad">—</div>
          <div class="kpi-lbl">Pendientes calidad</div>
        </div>
        <div class="kpi rojo">
          <div class="kpi-icon">💶</div>
          <div class="kpi-val" id="k_liq">—</div>
          <div class="kpi-lbl">Liquidaciones pendientes</div>
        </div>
        <div class="kpi rojo">
          <div class="kpi-icon">⚠️</div>
          <div class="kpi-val" id="k_alertas">—</div>
          <div class="kpi-lbl">Alertas stock antiguo</div>
        </div>
      </div>

      <div class="grid-2" style="margin-bottom:16px">
        <div class="card" style="margin:0">
          <div class="card-header">
            <h3>Kg recibidos últimos 7 días</h3>
          </div>
          <div class="card-body">
            <canvas id="chart_kg" height="160"></canvas>
          </div>
        </div>
        <div class="card" style="margin:0">
          <div class="card-header"><h3>Alertas activas</h3></div>
          <div class="card-body" id="alertas_list" style="padding:0 20px"></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card" style="margin:0">
          <div class="card-header">
            <h3>Últimos albaranes</h3>
            <a href="../recepcion/index.html" class="btn btn-sm btn-secondary">Ver todos</a>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Albarán</th><th>Finca</th><th>Kg</th><th>Estado</th></tr></thead>
              <tbody id="tabla_albaranes"></tbody>
            </table>
          </div>
        </div>
        <div class="card" style="margin:0">
          <div class="card-header"><h3>Fincas este mes</h3></div>
          <div class="card-body" style="padding:0 20px" id="tabla_fincas"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="loading"><div class="spinner"></div></div>

  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    async function init() {
      renderSidebar('dashboard');
      document.getElementById('fecha').textContent = getToday();
      showLoading(true);

      const hoy = new Date().toISOString().split('T')[0];
      const [{ data: albs }, { data: lotes }, { data: inspPend }, { data: liqPend }] = await Promise.all([
        sb.from('albaranes_entrada').select('*, fincas(nombre)').order('created_at', { ascending:false }).limit(100),
        sb.from('lotes').select('*').eq('estado','en_stock'),
        sb.from('albaranes_entrada').select('id').eq('estado','confirmado'),
        sb.from('liquidaciones').select('id').eq('estado','borrador')
      ]);
      showLoading(false);

      const deHoy = (albs||[]).filter(a => a.fecha === hoy);
      const kgHoy = deHoy.reduce((s,a) => s+(a.kg_total||0), 0);
      const kgStock = (lotes||[]).reduce((s,l) => s+(l.kg_actuales||0), 0);
      const alertas = (lotes||[]).filter(l => Math.floor((new Date()-new Date(l.fecha_entrada))/86400000) >= 7);

      document.getElementById('k_hoy').textContent = deHoy.length;
      document.getElementById('k_kg').textContent = kgHoy.toLocaleString('es-ES') + ' kg';
      document.getElementById('k_stock').textContent = kgStock.toLocaleString('es-ES') + ' kg';
      document.getElementById('k_calidad').textContent = (inspPend||[]).length;
      document.getElementById('k_liq').textContent = (liqPend||[]).length;
      document.getElementById('k_alertas').textContent = alertas.length;

      // Alertas
      const alertHtml = [
        ...(inspPend||[]).length ? [`<div class="alerta-item"><div class="alerta-ico warn">📋</div><div class="alerta-txt"><strong>${(inspPend||[]).length} albarán(es) pendientes de verificar</strong><span>Requieren revisión del oficinista</span></div></div>`] : [],
        ...(liqPend||[]).length ? [`<div class="alerta-item"><div class="alerta-ico rojo">💶</div><div class="alerta-txt"><strong>${(liqPend||[]).length} liquidación(es) pendientes de aprobar</strong><span>Requieren aprobación del gerente</span></div></div>`] : [],
        ...alertas.map(l => `<div class="alerta-item"><div class="alerta-ico warn">⚠️</div><div class="alerta-txt"><strong>${l.codigo} lleva ${Math.floor((new Date()-new Date(l.fecha_entrada))/86400000)} días en cámara</strong><span>${(l.kg_actuales||0).toLocaleString('es-ES')} kg</span></div></div>`)
      ];
      document.getElementById('alertas_list').innerHTML = alertHtml.length ? alertHtml.join('') : '<div class="alerta-item"><div class="alerta-ico ok">✅</div><div class="alerta-txt"><strong>Sin alertas activas</strong><span>Todo en orden</span></div></div>';

      // Tabla albaranes
      document.getElementById('tabla_albaranes').innerHTML = (albs||[]).slice(0,6).map(a => `
        <tr>
          <td><strong>${a.numero}</strong><br><span style="font-size:11px;color:var(--subtexto)">${formatDate(a.fecha)}</span></td>
          <td>${a.fincas?.nombre||'—'}</td>
          <td><strong>${(a.kg_total||0).toLocaleString('es-ES')} kg</strong></td>
          <td>${badgeEstado(a.estado)}</td>
        </tr>`).join('') || '<tr><td colspan="4" class="empty"><p>Sin albaranes</p></td></tr>';

      // Fincas del mes
      const mes = hoy.substring(0,7);
      const fincaMap = {};
      (albs||[]).filter(a => a.fecha?.startsWith(mes)).forEach(a => {
        const n = a.fincas?.nombre || 'Sin finca';
        fincaMap[n] = (fincaMap[n]||0) + (a.kg_total||0);
      });
      const fincas = Object.entries(fincaMap).sort((a,b) => b[1]-a[1]).slice(0,5);
      const totalKg = fincas.reduce((s,[,kg]) => s+kg, 0);
      document.getElementById('tabla_fincas').innerHTML = fincas.length ? fincas.map(([nombre, kg]) => `
        <div class="finca-row">
          <div class="finca-av">${nombre.substring(0,2).toUpperCase()}</div>
          <div class="finca-info"><strong>${nombre}</strong><span>${totalKg > 0 ? Math.round(kg/totalKg*100) : 0}% del total</span></div>
          <div class="finca-kg"><strong>${kg.toLocaleString('es-ES')} kg</strong></div>
        </div>`).join('') : '<div class="empty"><p>Sin datos este mes</p></div>';

      // Chart
      const dias = Array.from({length:7}, (_,i) => { const d=new Date(); d.setDate(d.getDate()-6+i); return d.toISOString().split('T')[0]; });
      const kgPorDia = dias.map(d => (albs||[]).filter(a=>a.fecha===d).reduce((s,a)=>s+(a.kg_total||0),0));
      new Chart(document.getElementById('chart_kg'), {
        type:'bar',
        data:{ labels:dias.map(d=>new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric'})), datasets:[{label:'Kg', data:kgPorDia, backgroundColor:'rgba(27,67,50,0.75)', borderRadius:5, hoverBackgroundColor:'#1B4332'}]},
        options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{font:{size:11}}}}, responsive:true, maintainAspectRatio:false }
      });
    }

    init();
  </script>
</body>
</html>
