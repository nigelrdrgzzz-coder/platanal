<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear Usuario — Platanal Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui; background: #1B4332; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: white; border-radius: 12px; padding: 32px; width: 360px; }
    h2 { color: #1B4332; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
    input, select { width: 100%; padding: 9px 12px; border: 1px solid #dee2e6; border-radius: 8px; font-size: 14px; margin-bottom: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 11px; background: #1B4332; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .msg { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
    .ok { background: #D1FAE5; color: #065F46; }
    .err { background: #FEE2E2; color: #991B1B; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🍌 Crear Usuario</h2>
    <label>Nombre</label>
    <input id="nombre" placeholder="Ej: Juan García">
    <label>Email</label>
    <input id="email" type="email" placeholder="email@ejemplo.com">
    <label>Contraseña</label>
    <input id="password" type="password" placeholder="Mínimo 6 caracteres">
    <label>Rol</label>
    <select id="rol">
      <option value="gerente">Gerente</option>
      <option value="oficinista">Oficinista</option>
      <option value="operario">Operario</option>
      <option value="chofer">Chofer</option>
      <option value="cosechero">Cosechero</option>
    </select>
    <button onclick="crear()">Crear Usuario</button>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    const sb = supabase.createClient(
      'https://jcenpwxoduuvvjbeukll.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjZW5wd3hvZHV1dnZqYmV1a2xsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NjgwODgsImV4cCI6MjA5MzA0NDA4OH0.1DvXD01wIZv91vpj5BZL3ogndT40Bis5jA8f-jHtfrs'
    );

    async function crear() {
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const rol = document.getElementById('rol').value;
      const msg = document.getElementById('msg');

      if (!nombre || !email || !password) {
        msg.className = 'msg err'; msg.style.display = 'block';
        msg.textContent = 'Rellena todos los campos'; return;
      }

      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) {
        msg.className = 'msg err'; msg.style.display = 'block';
        msg.textContent = 'Error: ' + error.message; return;
      }

      if (data.user) {
        await sb.from('users').insert({ id: data.user.id, email, nombre, rol });
      }

      msg.className = 'msg ok'; msg.style.display = 'block';
      msg.textContent = `✓ Usuario "${nombre}" creado con rol ${rol}`;
      document.getElementById('nombre').value = '';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
    }
  </script>
</body>
</html>
