<!DOCTYPE html>
<html lang="es">
<!-- REDIRECCION TEMPORAL SIN LOGIN -->
<script>window.location.href = 'dashboard/index.html';</script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platanal — Acceso</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1B4332 0%, #2D6A4F 100%);
    }
    .login-box {
      background: white;
      border-radius: 16px;
      padding: 44px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-logo .emoji { font-size: 48px; display: block; margin-bottom: 8px; }
    .login-logo h1 { color: var(--verde); font-size: 26px; margin-bottom: 4px; }
    .login-logo p { color: var(--gris-texto); font-size: 13px; }
    .btn-login { width: 100%; justify-content: center; padding: 11px; font-size: 15px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <span class="emoji">🍌</span>
      <h1>Platanal</h1>
      <p>Gestión de almacén de plátanos</p>
    </div>
    <div id="alert"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-login" onclick="handleLogin()">Entrar</button>
  </div>

  <div id="loading"><div class="spinner"></div></div>

  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script>
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showAlert('Rellena email y contraseña', 'error'); return; }
      showLoading(true);
      try {
        await login(email, password);
      } catch (e) {
        showAlert('Email o contraseña incorrectos', 'error');
        showLoading(false);
      }
    }
  </script>
</body>
</html>
